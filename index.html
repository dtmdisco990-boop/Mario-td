<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b1020;
    font-family: 'Courier New', Courier, monospace;
    color: #fff; overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: absolute;
    width: 1210px;
    transform-origin: top left;
    background: #0b1020;
    border: 4px solid #2b3a63;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);

  #topbar {
    height: 56px;

    padding: 0 10px;
    background: linear-gradient(#1d2a4d, #131d38);
    border-bottom: 3px solid #3a5490;
    font-size: 13px; font-weight: bold;
    letter-spacing: 1px;
  }
  .stat {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 9px;
    background: #0a1226;
    border: 2px solid #3a5490;
    border-radius: 5px;
    white-space: nowrap;
    font-size: 12px;
  }
  .stat .icon { width: 12px; height: 12px; display: inline-block; }
  .icon-heart { background: #e23b3b; clip-path: polygon(50% 100%, 0% 35%, 15% 0%, 50% 25%, 85% 0%, 100% 35%); }
  .icon-coin { background: #ffd23f; border-radius: 50%; border: 2px solid #b8860b; }
  .icon-star { background: #ffe060; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

  #coins { color: #ffd23f; }
  #stars { color: #ffe060; }
  #roundNum { color: #7ee87e; }

    font-family: inherit; font-weight: bold; cursor: pointer;
    background: #2a4a8f; color: #fff;
    border: 2px solid #5a86d8; border-radius: 5px;
    padding: 5px 10px; font-size: 12px; letter-spacing: 1px;

/* =========================================================================
   AUDIO
   ========================================================================= */
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol == null ? 0.05 : vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
let lastPop = 0, lastBoom = 0;
function sfxPop() { const n = performance.now(); if (n - lastPop < 30) return; lastPop = n; tone(900 + Math.random()*200, 0.055, 'square', 0.03, 1600); }
function sfxPlace() { tone(440, 0.07, 'square', 0.06); setTimeout(() => tone(660, 0.09, 'square', 0.06), 70); }
function sfxUpgrade() { [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f, 0.09, 'square', 0.055), i*65)); }
function sfxRoundClear() { [523,659,784,1047,1319].forEach((f,i) => setTimeout(() => tone(f, 0.16, 'square', 0.06), i*110)); }
function sfxError() { tone(150, 0.16, 'sawtooth', 0.05, 70); }
function sfxFreeze() { tone(1400, 0.11, 'sine', 0.05, 300); }
function sfxBoom() { const n = performance.now(); if (n - lastBoom < 45) return; lastBoom = n; tone(110, 0.2, 'sawtooth', 0.06, 40); }
function sfxLeak() { tone(300, 0.25, 'sawtooth', 0.07, 90); }
function sfxGameOver() { [400,340,280,200].forEach((f,i) => setTimeout(() => tone(f, 0.3, 'square', 0.07), i*200)); }

/* =========================================================================
   SAVE DATA
   ========================================================================= */
const SAVE_KEY = 'mmtd_save_v1';
const DEFAULT_HEROES = ['mario','piranha','icel','bomb','magi','star'];
const BOSS_HEROES = ['wario','waluigi','bowserjr'];
const HERO_COSTS = { yoshi: 15, peach: 20, toad: 15, dk: 25 };

let SAVE = (function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') {
      return {
        starCoins: s.starCoins || 0,
        heroes: Array.isArray(s.heroes) && s.heroes.length ? s.heroes : DEFAULT_HEROES.slice(),
        badges: Array.isArray(s.badges) ? s.badges : []
      };
    }
  } catch (e) {}
  return { starCoins: 0, heroes: DEFAULT_HEROES.slice(), badges: [] };
})();
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
}

   ========================================================================= */
function drawMatrix(g, m, pal, x, y, s) {
  for (let r = 0; r < m.length; r++) {
    const row = m[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === ' ' || ch === '.') continue;
      const col = pal[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x + c * s, y + r * s, s, s);
    }
  }
}

const RBE_CACHE = {};
function rbeOf(type) {
  if (RBE_CACHE[type] != null) return RBE_CACHE[type];
  const t = ENEMY_TYPES[type];
  let v = 1;
  if (t.children && t.children.length) for (const c of t.children) v += rbeOf(c);
  RBE_CACHE[type] = v;
  return v;
}

      const a = pts[i], b = pts[i+1];
      const len = Math.hypot(b[0]-a[0], b[1]-a[1]);
      segs.push({ x1:a[0], y1:a[1], x2:b[0], y2:b[1], len:len, start:total });
      total += len;
    }
    paths.push({ pts: pts, segs: segs, total: total });
  }
  return { def: def, paths: paths };
}

function posAt(d, pi) {
  const p = CUR_PATHS[pi || 0];
  if (!p) return { x: 0, y: 0 };
  if (d <= 0) return { x: p.segs[0].x1, y: p.segs[0].y1 };
  for (let i = 0; i < p.segs.length; i++) {
    const s = p.segs[i];
    if (d <= s.start + s.len) {
      const t = (d - s.start) / s.len;
      return { x: s.x1 + (s.x2-s.x1)*t, y: s.y1 + (s.y2-s.y1)*t };
    }
  }
  const l = p.segs[p.segs.length-1];
  return { x: l.x2, y: l.y2 };
}

function distToPath(px, py) {
  let best = 1e9;
  for (let pi = 0; pi < CUR_PATHS.length; pi++) {
    const segs = CUR_PATHS[pi].segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
      const l2 = dx*dx + dy*dy;
      let t = ((px - s.x1)*dx + (py - s.y1)*dy) / l2;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const qx = s.x1 + dx*t, qy = s.y1 + dy*t;
      const dd = Math.hypot(px - qx, py - qy);
      if (dd < best) best = dd;
    }
  }
  return best;
}

function seededRand(seed) {
  let s = seed >>> 0;
  return function () { s = (s*1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* =========================================================================
   WAVE BUILDER
   ========================================================================= */
function buildWave(r) {
  const out = [];
  if (r === 20) { out.push({type:'moab',count:1,gap:1,delay:0}); out.push({type:'rkoopa',count:8,gap:0.4,delay:0.5}); return flatten(out); }
  if (r === 30) { out.push({type:'moab',count:2,gap:2.5,delay:0}); out.push({type:'buzzy',count:16,gap:0.3,delay:3}); return flatten(out); }
  if (r === 40) { out.push({type:'bfb',count:1,gap:1,delay:0}); out.push({type:'moab',count:2,gap:3,delay:6}); out.push({type:'spiny',count:22,gap:0.22,delay:2}); return flatten(out); }
  if (r === 50) { out.push({type:'bfb',count:1,gap:1,delay:0}); out.push({type:'moab',count:2,gap:3,delay:5}); out.push({type:'buzzy',count:22,gap:0.22,delay:2}); return flatten(out); }

  const gap = Math.max(0.16, 0.62 - r*0.011);
  let delay = 0;
  if (r >= 1) { const n = Math.min(22, 5 + r*2); out.push({type:'goomba',count:n,gap:gap,delay:delay}); delay += n*gap*0.35; }
  if (r >= 3) { const n = Math.min(20, (r-2)*2); out.push({type:'gkoopa',count:n,gap:gap,delay:delay}); delay += n*gap*0.3; }
  if (r >= 6) { const n = Math.min(18, (r-5)*2); out.push({type:'rkoopa',count:n,gap:gap,delay:delay}); delay += n*gap*0.3; }
  if (r >= 9) { const n = Math.min(16, (r-8)*2); out.push({type:'spiny',count:n,gap:gap,delay:delay}); delay += n*gap*0.3; }
  if (r >= 12) { const n = Math.min(14, (r-11)*2); out.push({type:'buzzy',count:n,gap:gap,delay:delay}); delay += n*gap*0.3; }
  if (r >= 15) { const n = Math.min(9, (r-14)); out.push({type:'drybones',count:n,gap:gap*1.6,delay:delay}); delay += n*gap*1.2; }
  if (r >= 17) { const n = Math.min(12, (r-16)*2); out.push({type:'boo',count:n,gap:gap,delay:delay}); delay += n*gap*0.3; }
  if (r >= 22) { const n = Math.min(18, (r-21)*2); out.push({type:'drybones',count:n,gap:gap*0.9,delay:delay}); delay += n*gap*0.6; }
  if (r >= 26) { const n = Math.min(18, (r-25)*2); out.push({type:'boo',count:n,gap:gap*0.8,delay:delay}); delay += n*gap*0.5; }
  return flatten(out);
}

function flatten(groups) {
  const list = [];
  const np = Math.max(1, CUR_PATHS.length);
  for (const g of groups) {
    for (let k = 0; k < g.count; k++) {
      list.push({ type: g.type, t: g.delay + k*g.gap, pi: k % np });
    }
  }
  list.sort((a, b) => a.t - b.t);
  return list;
}

/* =========================================================================
   ENEMY SPAWN / COMBAT
   ========================================================================= */
function spawnEnemy(type, dist, pathIdx) {
  const d = ENEMY_TYPES[type];
  const e = {
    type: type, hp: d.hp, maxHp: d.hp,
    speed: d.speed * (G.diff ? G.diff.speedMul : 1),
    r: d.r, dist: dist || 0, pathIdx: pathIdx || 0,
    x: 0, y: 0,
    lead: !!d.lead, camo: !!d.camo, boss: !!d.boss,
    bossType: d.bossType || null,
    isBowser: !!d.isBowser,
    slowUntil: 0, slowFactor: 1, frozenUntil: 0,
    dead: false, children: d.children || [],
    wob: Math.random() * 6.28,
    specialCd: 3,
    attackTimer: 0,
    isAttacking: 0
  };
  const p = posAt(e.dist, e.pathIdx);
  e.x = p.x; e.y = p.y;
  G.enemies.push(e);
  return e;
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  const def = ENEMY_TYPES[e.type];
  G.coins += e.boss ? (e.type === 'bfb' ? 60 : e.type === 'moab' ? 25 : 80) : 1;
  sfxPop();
  G.effects.push({ type:'pop', x:e.x, y:e.y, t:0, life:0.32, color:def.color, r:e.r });

  if (e.bossType && G.bossDuel && !G.bossDuel.defeated) {
    G.bossDuel.defeated = true;
    let newlyUnlocked = false;
    if (SAVE.badges.indexOf(e.bossType) === -1) {
      SAVE.badges.push(e.bossType);
      newlyUnlocked = true;
    }
    if (SAVE.heroes.indexOf(e.bossType) === -1) {
      SAVE.heroes.push(e.bossType);
      newlyUnlocked = true;
    }
    if (newlyUnlocked) SAVE.starCoins += 10;
    saveGame();
    G.won = true;
    G.paused = true;
    G.roundActive = false;
    for (const en of G.enemies) if (en !== e && !en.dead) en.dead = true;
    G.effects.push({ type:'text', x:W/2, y:H/2-60, t:0, life:3, msg: 'BOSS DEFEATED!' });
    G.effects.push({ type:'text', x:W/2, y:H/2-20, t:0, life:3, msg: e.bossType.toUpperCase() + ' UNLOCKED!' });
    sfxRoundClear();
    return;
  }

  if (e.children && e.children.length) {
    for (let i = 0; i < e.children.length; i++) {
      const cd = Math.max(0, e.dist - i*5);
      spawnEnemy(e.children[i], cd, e.pathIdx);
    }
  }
}

function damageEnemy(e, dmg, opts) {
  if (e.dead) return;
  if (e.lead && !opts.fire) return;
  e.hp -= dmg;
  if (e.hp <= 0) killEnemy(e);
}

function splashDamage(x, y, radius, dmg, fire) {
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.dead) continue;
    if (Math.hypot(e.x - x, e.y - y) <= radius + e.r) damageEnemy(e, dmg, { fire: fire });
  }
  G.effects.push({ type:'ring', x:x, y:y, r:0, maxR:radius, t:0, life:0.28 });
  sfxBoom();
}

/* =========================================================================
   TOWER LOGIC
   ========================================================================= */
function computeStats(t) {
  const b = TOWER_DEFS[t.type].base;
  const s = {
    range: b.range, rate: b.rate, damage: b.damage, pierce: b.pierce,
    shots: b.shots, projSpeed: b.projSpeed,
    fire: !!b.fire, camo: !!b.camo,
    splash: b.splash || 0, homing: !!b.homing,
    projLife: b.projLife || 2,
    slowFactor: b.slowFactor || 0.5, freezeDur: b.freezeDur || 1.2,
    healPerRound: b.healPerRound || 0, income: b.income || 0,
    stunDur: b.stunDur || 0
  };
  for (let p = 0; p < 3; p++) {
    for (let i = 0; i < t.upgrades[p]; i++) UPGRADES[t.type][p][i].f(s);
  }
  return s;
}

function canUpgrade(t, pi) {
  if (t.upgrades[pi] >= 3) return false;
  if (t.upgrades[pi] === 2) {
    for (let o = 0; o < 3; o++) if (o !== pi && t.upgrades[o] >= 3) return false;
  }
  return true;
}

function upgradeCost(t, pi, ti) {
  return Math.round(UPGRADES[t.type][pi][ti].c * G.diff.upgradeMul);
}

function sellValue(t) { return Math.floor(t.invested * 0.7); }

function canPlace(x, y) {
  if (x < 22 || x > W-22 || y < 22 || y > H-22) return false;
  if (distToPath(x, y) < 34) return false;
  for (let i = 0; i < G.towers.length; i++) {
    if (Math.hypot(G.towers[i].x - x, G.towers[i].y - y) < 40) return false;
  }
  return true;
}

function pickTarget(t, st) {
  const list = [];
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.dead) continue;
    if (e.camo && !st.camo) continue;
    const d = Math.hypot(e.x - t.x, e.y - t.y);
    if (d <= st.range + e.r) list.push({ e: e, d: d });
  }
  if (list.length === 0) return null;
  switch (t.targeting) {
    case 'first': list.sort((a,b) => b.e.dist - a.e.dist); break;
    case 'last': list.sort((a,b) => a.e.dist - b.e.dist); break;
    case 'close': list.sort((a,b) => a.d - b.d); break;
    case 'strong': list.sort((a,b) => b.e.hp - a.e.hp); break;
    default: list.sort((a,b) => b.e.dist - a.e.dist);
  }
  return list[0].e;
}

function spawnProjectile(t, st, ang, speed, life, target) {
  let px = t.x + Math.cos(ang) * 15;
  let py = t.y + Math.sin(ang) * 15;

  if (t.type === 'piranha') {
    px = t.x + t.anim.x + Math.cos(ang) * 20;
    py = t.y + t.anim.y + Math.sin(ang) * 20 - 8;
  }

  let color = '#ff6020';
  if (t.type === 'mario' || t.type === 'star') color = ['#ff4040','#ffd700','#40ff80','#40c0ff'][Math.floor(Math.random()*4)];
  else if (t.type === 'magi') color = '#c060ff';
  else if (t.type === 'bomb' || t.type === 'wario') color = '#303030';
  else if (t.type === 'piranha') color = '#ff7020';
  else if (t.type === 'yoshi') color = '#40ff40';
  else if (t.type === 'peach') color = '#ff90c0';
  else if (t.type === 'toad') color = '#ffffff';
  else if (t.type === 'waluigi') color = '#a060ff';
  else if (t.type === 'bowserjr') color = '#ff8020';

  G.projectiles.push({
    x: px, y: py, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
    dmg: st.damage, pierce: Math.max(1, st.pierce),
    splash: st.splash, fire: st.fire, homing: st.homing,
    target: target || null, life: life, hits: [],
    color: color, size: (t.type === 'bomb' || t.type === 'wario') ? 5 : (t.type === 'star' ? 3 : 4),
    slow: st.slowFactor, freeze: st.freezeDur
  });
}

function iceBurst(t, st) {
  let any = false;
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.dead) continue;
    if (e.camo && !st.camo) continue;
    if (Math.hypot(e.x - t.x, e.y - t.y) <= st.range + e.r) {
      any = true;
      damageEnemy(e, st.damage, { fire: st.fire });
      e.frozenUntil = G.time + st.freezeDur;
      e.slowUntil = G.time + st.freezeDur + 1.5;
      e.slowFactor = st.slowFactor;
    }
  }
  G.effects.push({ type:'ring', x:t.x, y:t.y, r:0, maxR:st.range, t:0, life:0.3, ice:true });
  if (any) sfxFreeze();
}

function dkSmash(t, st) {
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.dead) continue;
    if (e.camo && !st.camo) continue;
    if (Math.hypot(e.x - t.x, e.y - t.y) <= st.range + e.r) {
      damageEnemy(e, st.damage, { fire: st.fire });
      e.frozenUntil = Math.max(e.frozenUntil, G.time + st.stunDur);
    }
  }
  G.effects.push({ type:'ring', x:t.x, y:t.y, r:0, maxR:st.range, t:0, life:0.35 });
  sfxBoom();
}

function fireTower(t, st, target) {
  const ang = Math.atan2(target.y - t.y, target.x - t.x);

  if (t.type === 'piranha') {
    t.attackAnim = 0.25;
    t.lastAttackAngle = ang;
    for (let i = 0; i < st.shots; i++) {
      const a = ang + (i * Math.PI * 2) / st.shots;
      spawnProjectile(t, st, a, st.projSpeed, st.projLife, null);
    }
    return;
  }
  if (t.type === 'icel') { iceBurst(t, st); return; }
  if (t.type === 'dk') { dkSmash(t, st); return; }

  for (let i = 0; i < st.shots; i++) {
    const spread = st.shots > 1 ? (i - (st.shots-1)/2) * 0.14 : 0;
    spawnProjectile(t, st, ang + spread, st.projSpeed, st.projLife, target);
  }
}

/* =========================================================================
   UPDATE
   ========================================================================= */
function update(dt) {
  G.time += dt;

  if (G.roundActive) {
    G.roundTime += dt;
    while (G.spawnQueue.length > 0 && G.spawnQueue[0].t <= G.roundTime) {
      const s = G.spawnQueue.shift();
      spawnEnemy(s.type, 0, s.pi || 0);
    }
  }

  G.synergyPairs = [];
  for (const m of G.towers) {
    if (m.type !== 'mario') continue;
    m.synergyPartner = null;
    let best = null, bestD = 160;
    for (const l of G.towers) {
      if (l.type !== 'icel') continue;
      const d = Math.hypot(m.x - l.x, m.y - l.y);
      if (d <= bestD) { bestD = d; best = l; }
    }
    if (best) { m.synergyPartner = best; G.synergyPairs.push([m, best]); }
  }

  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) continue;
    let sp = e.speed;
    if (e.frozenUntil > G.time) sp = 0;
    else if (e.slowUntil > G.time) sp *= e.slowFactor;

    if (e.bossType) {
      e.specialCd -= dt;
      if (e.specialCd <= 0) {
        e.specialCd = 3;
        if (e.bossType === 'wario') {
          spawnEnemy('goomba', Math.max(0, e.dist - 10), e.pathIdx);
          spawnEnemy('goomba', Math.max(0, e.dist - 20), e.pathIdx);
        } else if (e.bossType === 'waluigi') {
          const tot = CUR_PATHS[e.pathIdx].total;
          e.dist = Math.min(tot - 50, e.dist + 80);
        } else if (e.bossType === 'bowserjr') {
          spawnEnemy('spiny', Math.max(0, e.dist - 10), e.pathIdx);
        }
      }
    }

    if (e.isBowser) {
      e.attackTimer += dt;
      if (e.attackTimer > 3 && e.isAttacking <= 0) {
        e.isAttacking = 0.5;
        e.attackTimer = 0;
      }
      if (e.isAttacking > 0) {
        e.isAttacking -= dt;
      }
    }

    e.dist += sp * dt;
    const p = posAt(e.dist, e.pathIdx);
    e.x = p.x; e.y = p.y;
    e.wob += dt * 6;

    const tot = CUR_PATHS[e.pathIdx].total;
    if (e.dist >= tot) {
      G.lives -= rbeOf(e.type);
      G.enemies.splice(i, 1);
      sfxLeak();
      if (G.lives <= 0) {
        G.lives = 0; G.gameOver = true; G.paused = true; sfxGameOver();
      }
    }
  }

  for (let i = 0; i < G.towers.length; i++) {
    const t = G.towers[i];
    
    if (t.type === 'piranha') {
      t.anim.x = Math.sin(G.time * 3 + t.x) * 3;
      t.anim.y = Math.cos(G.time * 4 + t.y) * 2;
      if (t.attackAnim > 0) {
        t.attackAnim -= dt;
        const progress = 1 - (t.attackAnim / 0.25);
        const lunge = Math.sin(progress * Math.PI) * 15;
        t.anim.x += Math.cos(t.lastAttackAngle) * lunge;
        t.anim.y += Math.sin(t.lastAttackAngle) * lunge;
      }
    }

    const st = t.stats;
    t.cd -= dt;
    if (t.cd > 0) continue;
    const target = pickTarget(t, st);
    if (!target) continue;
    fireTower(t, st, target);
    let fireRate = st.rate;
    if (t.synergyPartner) fireRate *= 0.8;
    t.cd = fireRate;
    t.flash = 0.12;

    if (t.type === 'mario' && t.synergyPartner) {
      t.comboCd = (t.comboCd || 0) - st.rate;
      if (!t.comboCd || t.comboCd <= 0) {
        t.comboCd = 4;
        const midX = (t.x + t.synergyPartner.x) / 2;
        const midY = (t.y + t.synergyPartner.y) / 2;
        const ang = Math.atan2(target.y - midY, target.x - midX);
        G.projectiles.push({
          x: midX, y: midY,
          vx: Math.cos(ang)*560, vy: Math.sin(ang)*560,
          dmg: st.damage + t.synergyPartner.stats.damage + 2,
          pierce: 3, splash: 30, fire: true, homing: true,
          target: target, life: 2.5, hits: [],
          color: '#ffe060', size: 5, combo: true,
          slow: 0.4, freeze: 1.0
        });
        G.effects.push({ type:'ring', x:midX, y:midY, r:0, maxR:30, t:0, life:0.3, ice:false });
      }
    }
  }
  for (const t of G.towers) if (t.flash > 0) t.flash -= dt;

  for (let i = G.projectiles.length - 1; i >= 0; i--) {
    const p = G.projectiles[i];
    if (p.homing && p.target && !p.target.dead) {
      const wantA = Math.atan2(p.target.y - p.y, p.target.x - p.x);
      const curA = Math.atan2(p.vy, p.vx);
      let diff = wantA - curA;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      const step = Math.max(-7*dt, Math.min(7*dt, diff));
      const na = curA + step;
      const sp = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(na)*sp; p.vy = Math.sin(na)*sp;
    }
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.life <= 0 || p.x < -60 || p.x > W+60 || p.y < -60 || p.y > H+60) {
      G.projectiles.splice(i, 1); continue;
    }
    let remove = false;
    for (let k = 0; k < G.enemies.length; k++) {
      const e = G.enemies[k];
      if (e.dead) continue;
      if (p.hits.indexOf(e) !== -1) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + 5) {
        p.hits.push(e);
        if (p.splash > 0) { splashDamage(p.x, p.y, p.splash, p.dmg, p.fire); remove = true; break; }
        else {
          damageEnemy(e, p.dmg, { fire: p.fire });
          if (p.slow) { e.slowUntil = G.time + (p.freeze || 1) + 1; e.slowFactor = p.slow; e.frozenUntil = Math.max(e.frozenUntil, G.time + (p.freeze || 1)); }
          if (p.hits.length >= p.pierce) { remove = true; break; }
        }
      }
    }
    if (remove) G.projectiles.splice(i, 1);
  }

  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
  for (let i = G.effects.length - 1; i >= 0; i--) {
    const f = G.effects[i];
    f.t += dt;
    if (f.t >= f.life) G.effects.splice(i, 1);
  }

  if (G.roundActive && !G.won && !G.gameOver && G.spawnQueue.length === 0 && G.enemies.length === 0) {
    endRound();
  }
}

function endRound() {
  G.roundActive = false;

  let heal = 0, income = 0;
  for (const t of G.towers) {
    if (t.stats.healPerRound) heal += t.stats.healPerRound;
    if (t.stats.income) income += t.stats.income;
  }
  if (heal > 0) G.lives += heal;
  if (income > 0) G.coins += income;

  const bonus = 15 + G.round * 5;
  G.coins += bonus;
  sfxRoundClear();

  let msg = 'ROUND CLEAR!  +$' + (bonus + income);
  if (heal > 0) msg += '  +' + heal + ' LIVES';
  G.effects.push({ type:'text', x:W/2, y:H/2-40, t:0, life:1.8, msg: msg });

  if (G.round >= G.maxRounds) {
    G.won = true;
    G.paused = true;
    const sc = 5 + Math.floor(G.round / 2);
    SAVE.starCoins += sc;
    saveGame();
    G.effects.push({ type:'text', x:W/2, y:H/2+10, t:0, life:3, msg: '+' + sc + ' STAR COINS!' });
  } else {
    G.round++;
    if (G.autoStart) {
      setTimeout(function () {
        if (!G.gameOver && !G.won && !G.roundActive) startRound();
      }, 1400);
    }
  }
  updateHUD();
  updatePlayBtn();
  if (G.selected) openTowerPanel(G.selected);
}

/* =========================================================================
   RENDER
   ========================================================================= */
function drawTowerSprite(type, x, y, scale, alpha) {
  const def = TOWER_DEFS[type];
  const s = scale || 2;
  const matSize = def.mat.length;
  const w = matSize * s;
  const ox = Math.round(x - w / 2);
  const oy = Math.round(y - w / 2);
  
  if (alpha != null) ctx.globalAlpha = alpha;
  
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(ox - 3, oy + w - 4, w + 6, 6);
  ctx.fillStyle = '#6a6a6a'; ctx.fillRect(ox - 4, oy + w - 6, w + 8, 4);
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(ox - 4, oy + w - 6, w + 8, 2);
  
  drawMatrix(ctx, def.mat, def.pal, ox, oy, s);
  
  if (alpha != null) ctx.globalAlpha = 1;
}

function drawTower(t) {
  const def = TOWER_DEFS[t.type];
  const s = 2;
  const matSize = def.mat.length;
  const w = matSize * s;
  
  let ox = Math.round(t.x - w / 2);
  let oy = Math.round(t.y - w / 2);

  if (t.type === 'piranha') {
    ox += Math.round(t.anim.x);
    oy += Math.round(t.anim.y);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(ox - 3, oy + w - 4, w + 6, 7);
  ctx.fillStyle = '#6a6a6a'; ctx.fillRect(ox - 4, oy + w - 6, w + 8, 4);
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(ox - 4, oy + w - 6, w + 8, 2);

  const lv = t.upgrades[0] + t.upgrades[1] + t.upgrades[2];
  if (lv >= 3) {
    ctx.globalAlpha = 0.25 + 0.12*Math.sin(G.time*5);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(ox-5, oy-5, w+10, w+10);
    ctx.globalAlpha = 1;
  }
  
  drawMatrix(ctx, def.mat, def.pal, ox, oy, s);
  
  if (t.flash > 0) {
    ctx.globalAlpha = t.flash*4; ctx.fillStyle = '#ffffff';
    ctx.fillRect(ox, oy, w, w); ctx.globalAlpha = 1;
  }
  if (G.selected === t) {
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
    ctx.strokeRect(ox-3.5, oy-3.5, w+7, w+7);
  }
}

function drawBrosLink(a, b) {
  const ax = a.x, ay = a.y, bx = b.x, by = b.y;
  const pulse = 0.5 + 0.5*Math.sin(G.time*6);
  ctx.globalAlpha = 0.5 + pulse*0.4;
  ctx.lineWidth = 2 + pulse*2;
  ctx.strokeStyle = '#ffe060';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#40ff80';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const t = (G.time*0.8 + i/3) % 1;
    const px = ax + (bx-ax)*t;
    const py = ay + (by-ay)*t + Math.sin(G.time*8 + i)*6;
    ctx.fillStyle = i % 2 === 0 ? '#ffe060' : '#40ff80';
    ctx.fillRect(Math.round(px)-2, Math.round(py)-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  if (e.boss) { drawBoss(e); return; }
  const def = ENEMY_TYPES[e.type];
  let mat = M_CREATURE;
  if (e.type === 'spiny') mat = M_SPIKY;
  else if (e.type === 'drybones') mat = M_SKULL;
  else if (e.type === 'boo') mat = M_GHOST;
  const pal = { c: def.color, w: '#ffffff', k: '#101010', s: '#ffffff' };
  const s = 2, w = 8*s;
  const bob = Math.sin(e.wob) * 1.2;
  const x = Math.round(e.x - w/2), y = Math.round(e.y - w/2 + bob);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x+2, y+w-3, w-4, 3);
  if (e.camo) ctx.globalAlpha = 0.45;
  drawMatrix(ctx, mat, pal, x, y, s);
  if (e.camo) ctx.globalAlpha = 1;
  if (e.frozenUntil > G.time) {
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#8ce8ff';
    ctx.fillRect(x, y, w, w); ctx.globalAlpha = 1;
  } else if (e.slowUntil > G.time) {
    ctx.globalAlpha = 0.28; ctx.fillStyle = '#8ce8ff';
    ctx.fillRect(x, y, w, w); ctx.globalAlpha = 1;
  }
  if (e.lead) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x+2, y+2, 3, 3); ctx.fillRect(x+w-6, y+w-6, 3, 3);
  }
}

function drawBoss(e) {
  if (e.bossType) { drawCharBoss(e); return; }
  if (e.isBowser) { drawBowserBoss(e); return; }
  // Fallback airship
  const x = Math.round(e.x), y = Math.round(e.y);
  const big = e.type === 'bfb';
  const w = big ? 84 : 64, h = big ? 44 : 34;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x-w/2+4, y+h/2-4, w-8, 8);
  ctx.fillStyle = big ? '#8f1a1a' : '#b85410';
  ctx.fillRect(x-w/2, y-h/2, w, h);
  ctx.fillStyle = big ? '#d04040' : '#f08030';
  ctx.fillRect(x-w/2+4, y-h/2+4, w-8, 9);
  ctx.fillStyle = big ? '#4a0808' : '#6a2a04';
  ctx.fillRect(x-w/2, y+h/2-9, w, 9);
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(x-w/2+6, y-h/2+15, w-12, 3);
  ctx.fillRect(x-w/2+6, y-h/2+21, w-12, 2);
  ctx.fillStyle = '#f0e0c0';
  ctx.fillRect(x-w/2-8, y-h/2+2, 10, 12);
  ctx.fillRect(x+w/2-2, y-h/2+2, 10, 12);
  const eyeY = y - 8;
  ctx.fillStyle = '#101010';
  ctx.fillRect(x-20, eyeY, 14, 12); ctx.fillRect(x+6, eyeY, 14, 12);
  ctx.fillStyle = '#ff3020';
  ctx.fillRect(x-17, eyeY+3, 8, 6); ctx.fillRect(x+9, eyeY+3, 8, 6);
  const frac = e.hp / e.maxHp;
  if (frac < 0.66) {
    ctx.fillStyle = '#201010';
    ctx.fillRect(x-26, y-12, 2, 10); ctx.fillRect(x-24, y-4, 8, 2);
    ctx.fillRect(x+18, y-2, 2, 12);
  }
  if (frac < 0.33) {
    ctx.fillStyle = '#201010';
    ctx.fillRect(x-6, y-h/2+2, 2, 14);
    ctx.fillRect(x-4, y-h/2+14, 10, 2);
    ctx.fillRect(x+22, y-14, 2, 14);
    ctx.fillRect(x+10, y+2, 12, 2);
  }
  const spin = Math.sin(G.time*18) * 8;
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(x-2, y+h/2+2, 4, 8);
  ctx.fillStyle = '#d0d0d0'; ctx.fillRect(x-10+spin, y+h/2+8, 20, 3);
  drawBossHealthBar(x, y-h/2-16, w+16, 7, frac);
}

function drawBowserBoss(e) {
  const scale = e.type === 'bfb' ? 3 : 2;
  const matSize = 32;
  const w = matSize * scale;
  const bob = Math.sin(e.wob * 0.5) * 4;
  let x = Math.round(e.x - w/2);
  let y = Math.round(e.y - w/2 + bob);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x+10, y+w-10, w-20, 12);

  const pal = {
    R:'#e01010', G:'#20b020', Y:'#ffaa00', W:'#ffffff', 
    K:'#101010', S:'#a0a0a0', B:'#f0d8a0', M:'#500000'
  };
  
  let headOffset = 0;
  if (e.isAttacking > 0) {
    headOffset = -4;
  }

  for (let r = 0; r < 32; r++) {
    for (let c = 0; c < 32; c++) {
      const ch = M_BOWSER[r][c];
      if (ch === '.') continue;
      
      let rowOffset = (r < 16) ? headOffset : 0;
      
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x + c * scale, y + r * scale + rowOffset, scale, scale);
    }
  }
  
  if (e.isAttacking > 0) {
    const prog = 1 - (e.isAttacking / 0.5);
    ctx.fillStyle = '#ff4400';
    ctx.globalAlpha = 0.8;
    const fireW = 60 * prog;
    const fireH = 24 * prog;
    ctx.fillRect(x + w/2 - 10, y + w/3 + headOffset, fireW, fireH);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x + w/2 - 5, y + w/3 + 6 + headOffset, fireW*0.7, fireH*0.7);
    ctx.globalAlpha = 1;
  }
  
  const frac = e.hp / e.maxHp;
  drawBossHealthBar(x + w/2, y - 20, w + 10, 8, frac);
}

function drawCharBoss(e) {
  const x = Math.round(e.x), y = Math.round(e.y);
  const def = TOWER_DEFS[e.bossType];
  const scale = 4;
  const matSize = def.mat.length;
  const w = matSize * scale;
  const bob = Math.sin(e.wob*0.5) * 3;
  const ox = Math.round(x - w/2), oy = Math.round(y - w/2 + bob);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(ox+8, oy+w-6, w-16, 10);
  ctx.globalAlpha = 0.3 + 0.15*Math.sin(G.time*4);
  ctx.fillStyle = '#ff3020';
  ctx.fillRect(ox-8, oy-8, w+16, w+16);
  ctx.globalAlpha = 1;
  drawMatrix(ctx, def.mat, def.pal, ox, oy, scale);
  const frac = e.hp / e.maxHp;
  if (frac < 0.7) {
    ctx.fillStyle = '#101010';
    ctx.fillRect(ox+w/3, oy+w/4, 3, 20);
    ctx.fillRect(ox+w/3, oy+w/4+18, 12, 3);
  }
  if (frac < 0.4) {
    ctx.fillStyle = '#101010';
    ctx.fillRect(ox+w*2/3, oy+w/3, 3, 30);
    ctx.fillRect(ox+w*2/3-10, oy+w/3+20, 13, 3);
    ctx.fillRect(ox+w/4, oy+w*2/3, 3, 15);
  }
  const pulse = 0.5 + 0.5*Math.sin(G.time*8);
  ctx.globalAlpha = pulse*0.4;
  ctx.strokeStyle = '#ff6020'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, w*0.7, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  drawBossHealthBar(x, oy-18, w+20, 8, frac);
}

function drawBossHealthBar(x, y, w, h, frac) {
  const bxx = x - w/2, byy = y;
  ctx.fillStyle = '#000000';
  ctx.fillRect(bxx-1, byy-1, w+2, h+2);
  ctx.fillStyle = '#3a0a0a';
  ctx.fillRect(bxx, byy, w, h);
  ctx.fillStyle = frac > 0.5 ? '#40e040' : (frac > 0.25 ? '#f0c020' : '#e03030');
  ctx.fillRect(bxx, byy, Math.max(0, Math.round(w*frac)), h);
  ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 1;
  ctx.strokeRect(bxx+0.5, byy+0.5, w-1, h-1);
}

function drawProjectile(p) {
  ctx.fillStyle = p.color;
  const s = p.size;
  if (p.splash > 0) {
    ctx.fillRect(p.x - s, p.y - s, s*2, s*2);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  } else {
    ctx.fillRect(Math.round(p.x - s/2), Math.round(p.y - s/2), s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(Math.round(p.x - s/2), Math.round(p.y - s/2), 1, 1);
  }
  if (p.combo) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x-1, p.y-1, 2, 2);
  }
}

function drawEffect(f) {
  const k = f.t / f.life;
  if (f.type === 'pop') {
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = f.color;
    const rr = f.r * (0.6 + k*1.4);
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2 + f.t*6;
      ctx.fillRect(Math.round(f.x + Math.cos(a)*rr - 2), Math.round(f.y + Math.sin(a)*rr - 2), 4, 4);
    }
    ctx.globalAlpha = 1;
  } else if (f.type === 'ring') {
    ctx.globalAlpha = (1-k)*0.8;
    ctx.strokeStyle = f.ice ? '#8ce8ff' : '#ffb040';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.maxR*k, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (f.type === 'text') {
    ctx.globalAlpha = 1 - k*k;
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000'; ctx.fillText(f.msg, f.x+2, f.y+2);
    ctx.fillStyle = '#ffd700'; ctx.fillText(f.msg, f.x, f.y);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.drawImage(bg, 0, 0);

  if (G.placing) {
    const d = TOWER_DEFS[G.placing];
    const ok = canPlace(G.mouseX, G.mouseY) && G.coins >= d.cost;
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = ok ? '#ffffff' : '#ff3030';
    ctx.beginPath(); ctx.arc(G.mouseX, G.mouseY, d.base.range, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ok ? '#ffffff' : '#ff3030';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.mouseX, G.mouseY, d.base.range, 0, Math.PI*2); ctx.stroke();
    drawTowerSprite(G.placing, G.mouseX, G.mouseY, 2, ok ? 0.75 : 0.35);
  }

  if (G.selected && G.towers.indexOf(G.selected) !== -1) {
    const st = G.selected.stats;
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(G.selected.x, G.selected.y, st.range, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.selected.x, G.selected.y, st.range, 0, Math.PI*2); ctx.stroke();
  }

  for (const pair of G.synergyPairs) drawBrosLink(pair[0], pair[1]);

  for (let i = 0; i < G.towers.length; i++) drawTower(G.towers[i]);
  for (let i = 0; i < G.enemies.length; i++) drawEnemy(G.enemies[i]);
  for (let i = 0; i < G.projectiles.length; i++) drawProjectile(G.projectiles[i]);
  for (let i = 0; i < G.effects.length; i++) drawEffect(G.effects[i]);

  if (G.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 56px "Courier New", monospace';
    ctx.fillStyle = '#ff4040';
    ctx.fillText('GAME OVER', W/2, H/2 - 40);
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Reached Round ' + G.round, W/2, H/2 + 10);
    const sc = Math.floor(G.round / 3);
    ctx.fillStyle = '#ffe060';
    ctx.fillText('+' + sc + ' STAR COINS EARNED', W/2, H/2 + 50);
    if (!G._saved) { SAVE.starCoins += sc; saveGame(); G._saved = true; }
    ctx.textAlign = 'left';
  } else if (G.won) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px "Courier New", monospace';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(G.bossDuel ? 'BOSS DEFEATED!' : 'YOU WIN!', W/2, H/2 - 40);
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(G.bossDuel ? 'Badge earned! Return to lobby to see it.' : 'All ' + G.maxRounds + ' rounds cleared!', W/2, H/2 + 10);
    ctx.textAlign = 'left';
  } else if (G.paused && G.roundActive) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.textAlign = 'left';
  }
}

const elLives = document.getElementById('lives');
const elCoins = document.getElementById('coins');
const elStars = document.getElementById('stars');
const elRound = document.getElementById('roundNum');

const elSpeed = document.getElementById('speedBtn');

const elLobbyBtn = document.getElementById('lobbyBtn');

const hudCache = { l: -1, c: -1, r: -1, s: -1 };
let lastCoinForShop = -1;

function updateHUD() {
  if (hudCache.l !== G.lives) { elLives.textContent = G.lives; hudCache.l = G.lives; }
  if (hudCache.c !== G.coins) { elCoins.textContent = G.coins; hudCache.c = G.coins; }
  if (hudCache.r !== G.round) { elRound.textContent = G.round + '/' + G.maxRounds; hudCache.r = G.round; }
  if (hudCache.s !== SAVE.starCoins) { elStars.textContent = SAVE.starCoins; hudCache.s = SAVE.starCoins; }

  if (lastCoinForShop !== G.coins) {
    lastCoinForShop = G.coins;
    const items = elShop.querySelectorAll('.shopItem');
    for (let i = 0; i < items.length; i++) {
      const key = items[i].dataset.key;
      if (G.coins < TOWER_DEFS[key].cost) items[i].classList.add('poor');
      else items[i].classList.remove('poor');
    }
  }
}

function updatePlayBtn() {
  if (G.roundActive) elPlay.textContent = G.paused ? '▶ RESUME' : '❚❚ PAUSE';
  else elPlay.textContent = '▶ PLAY';
  elPlay.classList.toggle('on', G.roundActive && !G.paused);
}

   SHOP (IN-GAME)
   ========================================================================= */
function drawIcon(canvasEl, key) {
  const g = canvasEl.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 40, 40);
  g.fillStyle = '#0a1226';
  g.fillRect(0, 0, 40, 40);
  const def = TOWER_DEFS[key];
  const matSize = def.mat.length;
  const s = 40 / matSize;
  drawMatrix(g, def.mat, def.pal, 0, 0, s);
}

function buildShop() {
  elShop.innerHTML = '';
  for (const key of Object.keys(TOWER_DEFS)) {
    if (SAVE.heroes.indexOf(key) === -1) continue;
    const def = TOWER_DEFS[key];
    const item = document.createElement('div');
    item.className = 'shopItem';
    item.dataset.key = key;
    const icon = document.createElement('canvas');
    icon.width = 40; icon.height = 40;
    icon.className = 'icon';
    drawIcon(icon, key);
    const info = document.createElement('div');
    info.className = 'sInfo';
    info.innerHTML = '<div class="sName">' + def.name + '</div>' +
      '<div class="sCost">$' + def.cost + '</div>' +
      '<div class="sDesc">' + def.desc + '</div>';
    item.appendChild(icon);
    item.appendChild(info);
    item.addEventListener('click', function () { selectShop(key); });
    elShop.appendChild(item);
  }
}

function selectShop(key) {
  ensureAudio();
  if (G.coins < TOWER_DEFS[key].cost) { sfxError(); return; }
  G.placing = (G.placing === key) ? null : key;
  G.selected = null;
  elPanel.style.display = 'none';
  const items = elShop.querySelectorAll('.shopItem');
  for (let i = 0; i < items.length; i++) items[i].classList.toggle('sel', items[i].dataset.key === G.placing);
  updatePlayBtn();
}

/* =========================================================================
   TOWER PANEL
   ========================================================================= */
function openTowerPanel(t) {
  G.selected = t;
  G.placing = null;
  const items = elShop.querySelectorAll('.shopItem');
  for (let i = 0; i < items.length; i++) items[i].classList.remove('sel');
  const def = TOWER_DEFS[t.type];
  const lv = t.upgrades[0] + t.upgrades[1] + t.upgrades[2];

  let html = '<div class="tpHead">';
  html += '<span class="tpName">' + def.name + '</span>';
  html += '<span class="tpLv">LEVEL ' + lv + '</span>';
  html += '<button class="tpClose" data-act="close">X</button></div>';
  html += '<div class="tpRow">';
  const tgs = [['first','FIRST'],['last','LAST'],['close','CLOSE'],['strong','STRONG']];
  for (const tg of tgs) {
    html += '<button class="tgt' + (t.targeting === tg[0] ? ' on' : '') + '" data-tg="' + tg[0] + '">' + tg[1] + '</button>';
  }
  html += '<button class="tpSell" data-act="sell">SELL $' + sellValue(t) + '</button></div>';
  html += '<div class="tpPaths">';
  for (let pi = 0; pi < 3; pi++) {
    html += '<div class="pathCol"><div class="pathTitle">PATH ' + (pi+1) + '</div>';
    for (let ti = 0; ti < 3; ti++) {
      const up = UPGRADES[t.type][pi][ti];
      const cost = upgradeCost(t, pi, ti);
      const bought = t.upgrades[pi] > ti;
      const isNext = t.upgrades[pi] === ti;
      const allowed = canUpgrade(t, pi);
      const affordable = G.coins >= cost;
      let cls = 'upBtn';
      if (bought) cls += ' bought';
      else if (!isNext) cls += ' locked';
      else if (!allowed || !affordable) cls += ' cant';
      else cls += ' avail';
      const label = bought ? 'OWNED' : ('$' + cost);
      html += '<button class="' + cls + '" data-p="' + pi + '" data-t="' + ti + '">' +
        '<span class="upName">' + up.n + '</span>' +
        '<span class="upCost">' + label + '</span></button>';
    }
    html += '</div>';
  }
  html += '</div>';

  elPanel.innerHTML = html;
  elPanel.style.display = 'block';

  elPanel.querySelectorAll('[data-tg]').forEach(function (btn) {
    btn.addEventListener('click', function () { t.targeting = btn.dataset.tg; openTowerPanel(t); });
  });
  const closeBtn = elPanel.querySelector('[data-act="close"]');
  if (closeBtn) closeBtn.addEventListener('click', function () { G.selected = null; elPanel.style.display = 'none'; });
  const sellBtn = elPanel.querySelector('[data-act="sell"]');
  if (sellBtn) sellBtn.addEventListener('click', function () {
    G.coins += sellValue(t);
    const idx = G.towers.indexOf(t);
    if (idx !== -1) G.towers.splice(idx, 1);
    G.selected = null;
    elPanel.style.display = 'none';
    sfxPlace(); updateHUD();
  });
  elPanel.querySelectorAll('.upBtn.avail').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const pi = parseInt(btn.dataset.p, 10);
      const ti = parseInt(btn.dataset.t, 10);
      if (t.upgrades[pi] !== ti) return;
      if (!canUpgrade(t, pi)) { sfxError(); return; }
      const cost = upgradeCost(t, pi, ti);
      if (G.coins < cost) { sfxError(); return; }
      G.coins -= cost;
      t.upgrades[pi]++;
      t.invested += cost;
      t.stats = computeStats(t);
      sfxUpgrade(); updateHUD();
      openTowerPanel(t);
    });
  });
}

/* =========================================================================
   INPUT
   ========================================================================= */
function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (cv.width / r.width),
    y: (ev.clientY - r.top) * (cv.height / r.height)
  };
}

cv.addEventListener('mousemove', function (ev) { const p = canvasPos(ev); G.mouseX = p.x; G.mouseY = p.y; });
cv.addEventListener('mouseleave', function () { G.mouseX = -100; G.mouseY = -100; });
cv.addEventListener('contextmenu', function (ev) {
  ev.preventDefault();
  G.placing = null;
  const items = elShop.querySelectorAll('.shopItem');
  for (let i = 0; i < items.length; i++) items[i].classList.remove('sel');
});
cv.addEventListener('mousedown', function (ev) {
  ensureAudio();
  if (ev.button !== 0) return;
  const p = canvasPos(ev);
  if (G.placing) {
    const def = TOWER_DEFS[G.placing];
    if (G.coins < def.cost) { sfxError(); return; }
    if (!canPlace(p.x, p.y)) { sfxError(); return; }
    const t = {
      type: G.placing, x: Math.round(p.x), y: Math.round(p.y),
      upgrades: [0,0,0], targeting: 'first', cd: 0, flash: 0,
      invested: def.cost, synergyPartner: null, comboCd: 0,
      anim: { x: 0, y: 0 }, attackAnim: 0, lastAttackAngle: 0
    };
    t.stats = computeStats(t);
    G.towers.push(t);
    G.coins -= def.cost;
    sfxPlace(); updateHUD();
    if (G.coins < def.cost) {
      G.placing = null;
      const items = elShop.querySelectorAll('.shopItem');
      for (let i = 0; i < items.length; i++) items[i].classList.remove('sel');
    }
    return;
  }
  for (let i = G.towers.length - 1; i >= 0; i--) {
    const t = G.towers[i];
    const matSize = TOWER_DEFS[t.type].mat.length * 2;
    if (Math.hypot(t.x - p.x, t.y - p.y) < matSize / 2 + 4) { openTowerPanel(t); return; }
  }
  G.selected = null;
  elPanel.style.display = 'none';
});

window.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') {
    G.placing = null; G.selected = null;
    elPanel.style.display = 'none';
    const items = elShop.querySelectorAll('.shopItem');
    for (let i = 0; i < items.length; i++) items[i].classList.remove('sel');
  } else if (ev.code === 'Space') {
    ev.preventDefault();
    ensureAudio();
    if (!G.roundActive && !G.gameOver && !G.won) startRound();
    else if (G.roundActive) togglePause();
  }
});

/* =========================================================================
   ROUND CONTROL
   ========================================================================= */
function startRound() {
  if (G.roundActive || G.gameOver || G.won) return;
  ensureAudio();
  G.roundTime = 0;
  G.spawnQueue = buildWave(G.round);
  G.roundActive = true;
  G.paused = false;
  updatePlayBtn(); updateHUD();
}
function togglePause() {
  if (!G.roundActive) return;
  G.paused = !G.paused;
  updatePlayBtn();
}
elPlay.addEventListener('click', function () {
  ensureAudio();
  if (!G.roundActive) { if (G.gameOver || G.won) return; startRound(); }
  else togglePause();
});
elSpeed.addEventListener('click', function () {
  ensureAudio();
  G.speed = (G.speed === 1) ? 2 : 1;
  elSpeed.textContent = (G.speed === 2) ? '2x' : '1x';
  elSpeed.classList.toggle('on', G.speed === 2);
});
elAuto.addEventListener('change', function () {
  G.autoStart = elAuto.checked;
  if (G.autoStart && !G.roundActive && !G.gameOver && !G.won) startRound();
});

   ========================================================================= */
const lobbyEl = document.getElementById('lobby');
const gameEl = document.getElementById('game');

let lobbySelMap = 'meadow';
let lobbySelDiff = 'normal';

function showLobby() {
  lobbyEl.classList.remove('hidden');
  gameEl.style.display = 'none';
  buildLobby();
}
function hideLobby() {
  lobbyEl.classList.add('hidden');
  gameEl.style.display = '';
}

function buildLobby() {
  document.getElementById('starCoinsDisp').textContent = SAVE.starCoins;

  const mapGrid = document.getElementById('mapGrid');
  mapGrid.innerHTML = '';
  for (const key of Object.keys(MAP_DEFS)) {
    if (key === 'arena') continue;
    const def = MAP_DEFS[key];
    const card = document.createElement('div');
    card.className = 'card' + (lobbySelMap === key ? ' sel' : '');
    card.innerHTML = '<div class="cTitle">' + def.name + '</div><div class="cSub">' + def.sub + '</div>';
    card.addEventListener('click', function () { lobbySelMap = key; buildLobby(); });
    mapGrid.appendChild(card);
  }

  const diffGrid = document.getElementById('diffGrid');
  diffGrid.innerHTML = '';
  for (const key of Object.keys(DIFFS)) {
    const def = DIFFS[key];
    const card = document.createElement('div');
    card.className = 'card' + (lobbySelDiff === key ? ' sel' : '');
    card.innerHTML = '<div class="cTitle">' + def.name + '</div><div class="cSub">' + def.sub + '</div>';
    card.addEventListener('click', function () { lobbySelDiff = key; buildLobby(); });
    diffGrid.appendChild(card);
  }

  const heroGrid = document.getElementById('heroGrid');
  heroGrid.innerHTML = '';
  for (const key of Object.keys(TOWER_DEFS)) {
    const def = TOWER_DEFS[key];
    const owned = SAVE.heroes.indexOf(key) !== -1;
    const isBoss = BOSS_HEROES.indexOf(key) !== -1;
    const hasBadge = SAVE.badges.indexOf(key) !== -1;
    const card = document.createElement('div');
    card.className = 'card heroCard' + (owned ? '' : ' locked');

    const canvas = document.createElement('canvas');
    canvas.width = 48; canvas.height = 48;
    const g = canvas.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#0a1226'; g.fillRect(0, 0, 48, 48);
    const matSize = def.mat.length;
    const s = 48 / matSize;
    drawMatrix(g, def.mat, def.pal, 0, 0, s);

    const title = document.createElement('div');
    title.className = 'cTitle';
    title.textContent = def.name;

    card.appendChild(canvas);
    card.appendChild(title);

    if (owned) {
      const s = document.createElement('div');
      s.className = 'cSub';
      s.style.color = '#46d46e';
      s.textContent = isBoss ? '★ BADGE UNLOCKED' : 'OWNED';
      card.appendChild(s);
    } else if (isBoss) {
      const info = document.createElement('div');
      info.className = 'cSub';
      info.textContent = hasBadge ? 'Badge earned!' : 'Defeat boss to unlock';
      card.appendChild(info);
      const btn = document.createElement('button');
      btn.className = 'cAction' + (hasBadge ? ' disabled' : '');
      btn.textContent = hasBadge ? 'UNLOCKED' : '⚔ CHALLENGE BOSS';
      if (!hasBadge) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          startBossDuel(key);
        });
      }
      card.appendChild(btn);
    } else {
      const cost = HERO_COSTS[key];
      const canAfford = SAVE.starCoins >= cost;
      const info = document.createElement('div');
      info.className = 'cSub';
      info.textContent = def.desc;
      card.appendChild(info);
      const btn = document.createElement('button');
      btn.className = 'cAction' + (canAfford ? '' : ' disabled');
      btn.textContent = '★ ' + cost + (canAfford ? '' : ' NEEDED');
      if (canAfford) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          SAVE.starCoins -= cost;
          SAVE.heroes.push(key);
          saveGame();
          ensureAudio();
          sfxUpgrade();
          buildLobby();
        });
      }
      card.appendChild(btn);
    }
    heroGrid.appendChild(card);
  }
}

function startMatch(mapKey, diffKey) {
  const diff = DIFFS[diffKey];
  G.lives = diff.lives;
  G.coins = diff.coins;
  G.round = 1;
  G.maxRounds = diff.rounds;
  G.diff = diff;
  G.diffKey = diffKey;
  G.speed = 1;
  G.paused = true;
  G.roundActive = false;
  G.roundTime = 0;
  G.spawnQueue = [];
  G.enemies = [];
  G.towers = [];
  G.projectiles = [];
  G.effects = [];
  G.time = 0;
  G.gameOver = false;
  G.won = false;

function startBossDuel(bossType) {
  ensureAudio();
  startMatch('arena', 'normal');

  G.spawnQueue = [];
  const bossKey = bossType + 'Boss';

  updateHUD();

  ensureAudio();
  startMatch(lobbySelMap, lobbySelDiff);

elLobbyBtn.addEventListener('click', function () {
  G.paused = true;
  G.roundActive = false;
  showLobby();
});

/* =========================================================================
   SCALING
   ========================================================================= */
function fitScreen() {
  const availW = window.innerWidth - 20;
  const availH = window.innerHeight - 20;
  const s = Math.min(availW / 1210, availH / 726, 1.35);
  gameEl.style.transform = 'scale(' + s + ')';
  const w = 1210 * s, h = 726 * s;
  gameEl.style.left = Math.max(0, (window.innerWidth - w) / 2) + 'px';
  gameEl.style.top = Math.max(0, (window.innerHeight - h) / 2) + 'px';
}
window.addEventListener('resize', fitScreen);

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
let lastT = 0;
function loop(ts) {
  if (!lastT) lastT = ts;
  const raw = (ts - lastT) / 1000;
  lastT = ts;
  const dt = Math.min(0.05, Math.max(0, raw || 0));

  if (!lobbyEl.classList.contains('hidden')) {
    requestAnimationFrame(loop);
    return;
  }

  if (!G.paused && !G.gameOver && !G.won) {
    const steps = G.speed;
    for (let i = 0; i < steps; i++) update(dt);
  } else if (G.gameOver || G.won) {
    for (let i = G.effects.length - 1; i >= 0; i--) {
      const f = G.effects[i];
      f.t += dt;
      if (f.t >= f.life) G.effects.splice(i, 1);
    }
  }
  render();
  updateHUD();
  requestAnimationFrame(loop);
}

/* =========================================================================
   BOOT
   ========================================================================= */
showLobby();
fitScreen();
requestAnimationFrame(loop);

window.addEventListener('pointerdown', function once() {
  ensureAudio();
  window.removeEventListener('pointerdown', once);
});
</script>
</body>
</html>
